<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOOM</title>

    <script src="https://thedoggybrad.github.io/doom_on_js-dos/js-dos-api.js"></script>

    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #121212;
        display: grid;
        place-items: center;
      }

      /* Your existing sizing/overlay */
      #DOOM > .dosbox-container { width: 640px; height: 400px; }
      #DOOM > .dosbox-container > .dosbox-overlay {
        background: url("https://thedoggybrad.github.io/doom_on_js-dos/DOOM.png");
      }
      #DOOM > .dosbox-container > .dosbox-overlay > .dosbox-start {
        border-radius: 17px;
        border: 0;
        background-color: rgba(90, 90, 90, 0.57);
        padding: 5px;
        text-align: center;
        width: 10em;
        margin: 0 auto;
      }
    </style>
  </head>

  <body>
    <div id="DOOM" class="dosbox-default"></div>

    <script>
      var dosbox_DOOM = new Dosbox({
        id: "DOOM",
        onload: function () {
          dosbox_DOOM.run(
            "https://thedoggybrad.github.io/doom_on_js-dos/DOOM-@evilution.zip",
            "./DOOM/DOOM.EXE"
          );
        }
      });

      // Optional: double-click the game to fullscreen (no button, no text)
      document.getElementById("DOOM").addEventListener("dblclick", function () {
        dosbox_DOOM.requestFullScreen();
      });
    </script>
  </body>
</html>

<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Ellie's MS-DOS Arcade</title>

<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>

<style>
body {
  margin:0;
  background:#0f1117;
  color:white;
  font-family:system-ui;
  display:flex;
  flex-direction:column;
  height:100vh;
}
header {
  padding:10px;
  background:#161b22;
  display:flex;
  gap:10px;
  align-items:center;
}
select, button {
  background:#21262d;
  color:white;
  border:1px solid #30363d;
  padding:8px;
  border-radius:6px;
}
#dos { flex:1; }
</style>
</head>

<body>

<header>
  <strong>Ellie's MS-DOS Arcade</strong>

  <select id="gameSelect"></select>
  <button onclick="loadGame()">Play</button>
</header>

<div id="dos"></div>

<script>
let dosInstance = null;

async function loadGames() {
  const res = await fetch("games.json");
  const games = await res.json();

  const select = document.getElementById("gameSelect");

  games.forEach(g => {
    const opt = document.createElement("option");
    opt.value = g.file;
    opt.textContent = g.title;
    select.appendChild(opt);
  });
}

async function loadGame() {
  if (dosInstance) {
    await dosInstance.stop();
    document.getElementById("dos").innerHTML = "";
  }

  const file = document.getElementById("gameSelect").value;

  dosInstance = Dos(document.getElementById("dos"), {
    url: file,
    autoStart: true,
    renderAspect: "Fit"
  });
}

loadGames();
</script>

</body>
</html>

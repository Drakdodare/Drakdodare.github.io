<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DOOM (DOS) - js-dos</title>

    <!-- js-dos v7 (simple script-tag API) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/js-dos@7.4.7/dist/js-dos.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/js-dos@7.4.7/dist/js-dos.js"></script>

    <style>
      html, body { height: 100%; margin: 0; background: #000; }
      #jsdos { width: 100%; height: 100%; }
    </style>
  </head>

  <body>
    <div id="jsdos"></div>

    <script>
      // Loads doom.jsdos from the same folder (your repo root)
      Dos(document.getElementById("jsdos")).run("doom.jsdos");
    </script>
  </body>
</html>

<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>Ellie's MS-DOS Arcade</title>

<link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
<script src="https://v8.js-dos.com/latest/js-dos.js"></script>

<style>
body {
  margin:0;
  background:#0f1117;
  color:white;
  font-family:system-ui;
  display:flex;
  height:100vh;
  overflow:hidden;
}

#sidebar {
  width:300px;
  background:#161b22;
  padding:10px;
  overflow-y:auto;
  border-right:1px solid #30363d;
}

#search {
  width:100%;
  padding:8px;
  margin-bottom:10px;
  background:#21262d;
  border:1px solid #30363d;
  color:white;
  border-radius:6px;
}

.game {
  padding:8px;
  margin-bottom:6px;
  background:#21262d;
  border-radius:6px;
  cursor:pointer;
}

.game:hover {
  background:#30363d;
}

#player {
  flex:1;
}

</style>
</head>

<body>

<div id="sidebar">
  <input id="search" placeholder="Search games..." />
  <div id="gameList"></div>
</div>

<div id="player"></div>

<script>

let dosInstance = null;
let allGames = [];

async function loadGames() {
  const res = await fetch("games.json");
  allGames = await res.json();
  renderGames(allGames);
}

function renderGames(games) {
  const container = document.getElementById("gameList");
  container.innerHTML = "";

  games.forEach(g => {
    const div = document.createElement("div");
    div.className = "game";
    div.textContent = g.title;
    div.onclick = () => loadGame(g.file);
    container.appendChild(div);
  });
}

async function loadGame(file) {
  if (dosInstance) {
    await dosInstance.stop();
    document.getElementById("player").innerHTML = "";
  }

  dosInstance = Dos(document.getElementById("player"), {
    url: file,
    autoStart: true,
    renderAspect: "Fit"
  });
}

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  const filtered = allGames.filter(g => 
    g.title.toLowerCase().includes(q)
  );
  renderGames(filtered);
});

loadGames();

</script>

</body>
</html>

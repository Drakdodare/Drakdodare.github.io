<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DOS Games (js-dos) – drakdodare.github.io</title>

    <!-- js-dos (official CDN, always latest v8) -->
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0b0b0b;
        color: #eaeaea;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      }

      #topbar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid #222;
        background: #111;
      }

      #topbar select, #topbar button {
        background: #1a1a1a;
        color: #eaeaea;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 14px;
        cursor: pointer;
      }

      #topbar button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #status {
        margin-left: auto;
        opacity: 0.85;
        font-size: 13px;
      }

      #dos {
        height: calc(100% - 52px);
        width: 100%;
      }

      /* Optional: if you ever enable "softFullscreen", js-dos uses this class */
      .jsdos-fullscreen-workaround {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        z-index: 9999 !important;
      }
    </style>
  </head>

  <body>
    <div id="topbar">
      <label for="gameSelect">Game:</label>
      <select id="gameSelect"></select>

      <button id="btnStart">Start</button>
      <button id="btnStop" disabled>Stop</button>
      <button id="btnFullscreen" disabled>Fullscreen</button>

      <div id="status">Ready</div>
    </div>

    <div id="dos"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>

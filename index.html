<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>drakdodare DOS Arcade</title>

    <!-- js-dos (v8) -->
    <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css" />
    <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
    <!-- CDN snippet is from js-dos docs -->
    <!-- https://js-dos.com/dos-api.html -->

    <style>
      :root {
        --bg: #0b0d10;
        --panel: #121722;
        --text: #e7eefc;
        --muted: #9fb0cc;
        --border: #25314a;
        --btn: #1f2a3f;
        --btnHover: #2a3752;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      header .title {
        font-weight: 700;
        letter-spacing: 0.2px;
        margin-right: 8px;
      }
      select,
      button {
        background: var(--btn);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 14px;
        outline: none;
      }
      button {
        cursor: pointer;
        user-select: none;
      }
      button:hover {
        background: var(--btnHover);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .spacer {
        flex: 1;
      }
      .hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.2;
      }
      main {
        height: calc(100% - 58px);
      }
      #player {
        width: 100%;
        height: 100%;
      }
      /* Optional: give the player a clean edge */
      #player {
        border-top: 1px solid #000;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="title">DOS Arcade</div>

      <select id="gameSelect" title="Choose a game"></select>

      <button id="startBtn">Start</button>
      <button id="stopBtn" disabled>Stop</button>

      <div class="spacer"></div>

      <div class="hint">
        Click inside the game to capture keyboard/mouse.<br />
        Use the js-dos sidebar for fullscreen/settings.
      </div>
    </header>

    <main>
      <div id="player"></div>
    </main>

    <script>
      const selectEl = document.getElementById("gameSelect");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const playerEl = document.getElementById("player");

      /** @type {any} js-dos player instance */
      let dos = null;

      function setUiState(running) {
        stopBtn.disabled = !running;
        startBtn.disabled = false;
      }

      async function stopGame() {
        if (!dos) return;
        try {
          // Player API: stop() frees resources; restart by making a new instance. :contentReference[oaicite:1]{index=1}
          await dos.stop();
        } catch (e) {
          console.warn("stop() failed:", e);
        } finally {
          dos = null;
          playerEl.innerHTML = "";
          setUiState(false);
        }
      }

      async function startGame(bundleUrl) {
        await stopGame();

        // Clear container before creating a fresh instance
        playerEl.innerHTML = "";

        // Create player instance, point it at your .jsdos bundle
        dos = Dos(playerEl, {
          url: bundleUrl,
          autoStart: true,
          // Quality-of-life defaults:
          renderAspect: "Fit",
          imageRendering: "pixelated",
          noCloud: true,
          noNetworking: true,
          // workerThread defaults to true; fine on GitHub Pages. :contentReference[oaicite:2]{index=2}
        });

        setUiState(true);
      }

      function populateGames(games) {
        selectEl.innerHTML = "";
        for (const g of games) {
          const opt = document.createElement("option");
          opt.value = g.bundle;
          opt.textContent = g.title;
          selectEl.appendChild(opt);
        }
      }

      async function loadGamesList() {
        try {
          const res = await fetch("./games.json", { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const games = await res.json();
          if (!Array.isArray(games) || games.length === 0)
            throw new Error("games.json is empty/invalid");
          populateGames(games);
        } catch (e) {
          console.warn("Failed to load games.json, using fallback:", e);

          // Fallback uses a public demo bundle from js-dos (just so the page works immediately). :contentReference[oaicite:3]{index=3}
          populateGames([
            {
              title: "Digger (demo bundle from js-dos CDN)",
              bundle: "https://v8.js-dos.com/bundles/digger.jsdos",
            },
          ]);
        }
      }

      startBtn.addEventListener("click", async () => {
        const bundleUrl = selectEl.value;
        if (!bundleUrl) return;

        // Resolve relative bundle paths like "bundles/mygame.jsdos"
        const resolved = new URL(bundleUrl, window.location.href).toString();
        await startGame(resolved);
      });

      stopBtn.addEventListener("click", stopGame);

      loadGamesList();
      setUiState(false);
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Drakdodare | Portfolio Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <meta name="description" content="Official website of Drak Dodare. Portfolio launching soon.">
    <meta name="author" content="Drak Dodare">
    <meta name="robots" content="index, follow">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            overflow: hidden;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            padding: 50px 40px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            animation: fadeIn 1.2s ease-in-out;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .spinner {
            margin: 25px auto;
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            border-radius: 30px;
            background: white;
            color: #1e3c72;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }

        .btn:hover {
            background: #f1f1f1;
            transform: translateY(-3px);
        }

        .social {
            margin-top: 20px;
        }

        .social a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.3s ease;
        }

        .social a:hover {
            opacity: 0.7;
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            opacity: 0.6;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>🚧 Website Under Construction 🚧</h1>

        <div class="spinner"></div>

        <p>
            Hi, I'm <strong>Drakdodare</strong>.<br>
            I'm currently building something exciting.<br>
            My portfolio will be live soon.
        </p>

        <a href="mailto:ellie@shibui-linux.co.jp" class="btn">Contact Me</a>
        <a href="https://github.com/drakdodare" target="_blank" class="btn">GitHub</a>

        <footer>
            © 2009-2026 Drakdodare. All rights reserved.
        </footer>
    </div>

</body>
</html>

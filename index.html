<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>drakdodare DOS Arcade</title>

  <!-- js-dos v8 (CDN) -->
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
  <!-- ^ official “Getting Started” uses these URLs -->
  <!-- https://v8.js-dos.com/latest/js-dos.css / js-dos.js -->
  <!-- :contentReference[oaicite:1]{index=1} -->

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="topbar">
    <div class="left">
      <span class="brand">🖥️ drakdodare DOS Arcade</span>
      <span id="status" class="status">Ready</span>
    </div>

    <div class="right">
      <label class="label">Hosted:</label>
      <select id="hostedSelect" class="select"></select>
      <button id="playHosted" class="btn">Play</button>

      <div class="divider"></div>

      <label class="label">Upload from PC:</label>
      <input id="fileInput" class="file" type="file" accept=".jsdos,.zip" />

      <div class="divider"></div>

      <button id="fullscreen" class="btn">Fullscreen</button>
      <button id="stop" class="btn danger">Stop</button>
    </div>
  </header>

  <main class="main">
    <div id="dos" class="dos"></div>
  </main>

  <script src="./app.js"></script>
</body>
</html>

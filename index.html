<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>drakdodare DOS Emulator</title>

  <!-- js-dos (v8) -->
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>

  <style>
    html, body { height: 100%; margin: 0; background: #0b0f14; color: #e7eef7; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .bar {
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
      padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.03);
    }
    button, input {
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: inherit;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 14px;
    }
    button { cursor: pointer; }
    button:hover { background: rgba(255,255,255,.10); }
    input[type="text"] { min-width: 260px; }
    .hint { opacity: .75; font-size: 13px; }
    #dos {
      height: calc(100% - 64px);
      width: 100%;
    }
    @media (max-width: 520px) {
      #dos { height: calc(100% - 110px); }
      input[type="text"] { min-width: 180px; }
    }
  </style>
</head>

<body>
  <div class="bar">
    <button id="run-digger">Run sample (Digger)</button>
    <button id="run-local">Run my bundle (./bundles/mygame.jsdos)</button>

    <input id="bundle-url" type="text" placeholder="Paste a .jsdos URL (https://.../game.jsdos)" />
    <button id="run-url">Run URL</button>

    <input id="bundle-file" type="file" accept=".jsdos" />
    <span class="hint">Tip: start with the sample first.</span>
  </div>

  <div id="dos"></div>

  <script>
    const DOS_EL = document.getElementById("dos");

    function startBundle(url) {
      if (!url) return;

      // reset the container so a new player can mount cleanly
      DOS_EL.innerHTML = "";

      // v8 "Getting Started" style: pass the bundle URL in options
      Dos(DOS_EL, { url });
    }

    document.getElementById("run-digger").addEventListener("click", () => {
      startBundle("https://v8.js-dos.com/bundles/digger.jsdos");
    });

    document.getElementById("run-local").addEventListener("click", () => {
      startBundle("./bundles/mygame.jsdos");
    });

    document.getElementById("run-url").addEventListener("click", () => {
      const url = document.getElementById("bundle-url").value.trim();
      startBundle(url);
    });

    document.getElementById("bundle-file").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const blobUrl = URL.createObjectURL(file);
      startBundle(blobUrl);
    });

    // Auto-run the sample once so you instantly see it working:
    startBundle("https://v8.js-dos.com/bundles/digger.jsdos");
  </script>
</body>
</html>

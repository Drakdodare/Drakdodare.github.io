<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>drakdodare DOS Arcade</title>

    <!-- js-dos player UI styles (v7) -->
    <link rel="stylesheet" href="https://js-dos.com/v7/build/releases/latest/js-dos/js-dos.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand__title">DOS Arcade</div>
        <div class="brand__sub">drakdodare.github.io</div>
      </div>

      <div class="actions">
        <label class="filebtn">
          <input id="fileInput" type="file" accept=".jsdos,.zip,application/zip" />
          Run local bundle…
        </label>

        <button id="stopBtn" class="btn" disabled>Stop</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar__head">
          <div class="sidebar__title">Games</div>
          <div id="status" class="status">Loading manifest…</div>
        </div>

        <div id="gameList" class="gamelist"></div>

        <div class="hint">
          <div class="hint__title">Tips</div>
          <ul>
            <li>Drop a <code>.jsdos</code> file anywhere to run it.</li>
            <li>Hosted bundles live in <code>/games</code> and are listed in <code>manifest.json</code>.</li>
          </ul>
        </div>
      </aside>

      <section class="stage">
        <!-- js-dos mounts into this div -->
        <div id="jsdos" class="jsdos"></div>
      </section>
    </main>

    <!-- js-dos library (v7) -->
    <script src="https://js-dos.com/v7/build/releases/latest/js-dos/js-dos.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
